<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="data:," />
    <title>UI kit interactions</title>
  </head>
  <body>
    <div id="fixture"></div>
    <script type="module">
      import "/src/app/styles.css";
      import { createApp, h, reactive, ref, nextTick } from "vue";
      import UiButton from "/src/common/ui/UiButton.vue";
      import UiField from "/src/common/ui/UiField.vue";
      import UiControl from "/src/common/ui/UiControl.vue";
      import UiResizeHandle from "/src/common/ui/UiResizeHandle.vue";
      import { usePointerDrag } from "/src/common/utilities/pointer-drag.ts";

      const state = reactive({
        name: "",
        busy: false,
        submitted: 0,
        clicked: 0,
        width: 180,
        visible: true,
      });
      const finishes = [];
      const control = ref();
      const Resize = {
        setup() {
          const drag = usePointerDrag({
            start: (event) => ({ x: event.clientX, width: state.width }),
            move: (event, start) => (state.width = start.width + event.clientX - start.x),
            finish: (reason) => finishes.push(reason),
            cursor: () => "col-resize",
          });
          return () =>
            h(UiResizeHandle, {
              id: "resize",
              orientation: "vertical",
              appearance: "bar",
              "aria-label": "Ширина",
              "aria-valuenow": state.width,
              dragging: drag.dragging.value,
              onPointerdown: drag.start,
            });
        },
      };
      createApp({
        render: () =>
          h("main", [
            h(
              "form",
              {
                onSubmit: (event) => {
                  event.preventDefault();
                  state.submitted++;
                },
              },
              [
                h(
                  UiField,
                  { label: "Название", hint: "Обязательное поле" },
                  {
                    default: ({ control: attrs }) =>
                      h(UiControl, {
                        ...attrs,
                        ref: control,
                        name: "name",
                        required: true,
                        modelValue: state.name,
                        "onUpdate:modelValue": (value) => (state.name = value),
                      }),
                  },
                ),
                h(
                  UiButton,
                  { id: "save", type: "submit", appearance: "solid", busy: state.busy },
                  () => "Сохранить",
                ),
                h(
                  UiButton,
                  {
                    id: "action",
                    shape: "icon",
                    size: "sm",
                    "aria-label": "Действие",
                    onClick: () => state.clicked++,
                  },
                  () => "+",
                ),
                h(UiButton, { id: "danger", tone: "danger" }, () => "Удалить"),
              ],
            ),
            h(
              "div",
              { style: { display: "flex", width: `${state.width}px`, height: "90px" } },
              state.visible ? [h(Resize)] : [],
            ),
          ]),
      }).mount("#fixture");
      document.addEventListener(
        "pointerdown",
        (event) => (window.lastPointer = event.pointerId),
        true,
      );
      window.fixture = { state, finishes, control, ready: true, settle: () => nextTick() };
    </script>
    <style>
      main {
        padding: 16px;
        max-width: 420px;
      }
      form {
        display: grid;
        gap: 12px;
      }
    </style>
  </body>
</html>
