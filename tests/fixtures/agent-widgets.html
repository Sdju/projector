<!doctype html>
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<div id="fixture"></div>
<script type="module">
  import "/src/app/styles.css";
  import { createApp, h, ref } from "vue";
  import AgentMessage from "/src/modules/agent/ui/AgentMessage.vue";
  import { chatProjectKey } from "/src/modules/chat-images/index.ts";
  import { widgetReplyKey } from "/src/modules/widget-runtime/index.ts";
  import { registerBuiltinWidgets } from "/src/app/widgets.ts";
  registerBuiltinWidgets();
  const text = ref("");
  const streaming = ref(true);
  const promoted = ref("");
  const answered = ref(false);
  const replies = [];
  const app = createApp({
    setup: () => () =>
      h("div", { style: "padding: 24px; max-width: 760px" }, [
        h(AgentMessage, {
          text: text.value,
          streaming: streaming.value,
          promoted: promoted.value,
          answered: answered.value,
        }),
      ]),
  });
  app.provide(widgetReplyKey, (message) => replies.push(message));
  app.provide(chatProjectKey, "p");
  app.mount("#fixture");
  window.fixture = {
    ready: true,
    replies,
    set(value, live = true) {
      text.value = value;
      streaming.value = live;
    },
    promote(value) {
      promoted.value = value;
    },
    answer(value) {
      answered.value = value;
    },
  };
</script>
