<!doctype html>
<link rel="icon" href="data:," />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<div id="fixture"></div>
<script type="module">
  import "/packages/client/app/styles.css";
  import { createApp, h, ref } from "vue";
  import AgentSessions from "/packages/client/modules/agent/ui/AgentSessions.vue";
  const sessions = ref([
    { id: "one", title: "First session" },
    { id: "two", title: "Second session" },
  ]);
  const loading = ref(false);
  const recent = ref([]);
  let loadOnOpen = false;
  const changes = [],
    picks = [],
    opened = [],
    removedRecent = [];
  createApp({
    setup: () => () =>
      h("div", { style: "padding: 30px" }, [
        h(AgentSessions, {
          sessions: sessions.value,
          recent: recent.value,
          loading: loading.value,
          onOpen: () => {
            if (loadOnOpen) loading.value = true;
          },
          error: "",
          disabled: false,
          editable: true,
          onChange: (id, change) => changes.push({ id, change }),
          onPick: (id) => picks.push(id),
          onOpenRecent: (chat, title) => opened.push({ chat, title }),
          onRemove: (target) => {
            if (typeof target === "string") return;
            removedRecent.push(target.chat);
            recent.value = recent.value.filter((item) => item.chat !== target.chat);
          },
        }),
        h("button", { id: "outside", style: "margin-top: 200px" }, "Outside"),
      ]),
  }).mount("#fixture");
  window.fixture = {
    ready: true,
    changes,
    picks,
    opened,
    removedRecent,
    empty: () => {
      sessions.value = [];
      loadOnOpen = true;
    },
    loaded: () => {
      sessions.value = [{ id: "loaded", title: "Loaded session" }];
      loading.value = false;
      loadOnOpen = false;
    },
    many: () => {
      sessions.value = Array.from({ length: 6 }, (_, i) => ({
        id: String(i),
        title: `Session ${i}`,
      }));
    },
    branches: () => {
      sessions.value = [
        { id: "main-one", title: "Main chat one" },
        { id: "main-two", title: "Main chat two" },
        { id: "main-three", title: "Main chat three" },
        { id: "branch-one", title: "Explore sidebar", parent: "main-one", agent: "explore" },
        { id: "branch-two", title: "Audit tests", parent: "main-two", agent: "general" },
      ];
    },
    linked: () => {
      sessions.value = [
        { id: "session-main", title: "Main session" },
        { id: "session-other", title: "Other session" },
      ];
      recent.value = [
        {
          chat: "chat-main",
          backend: "opencode",
          title: "Main tab",
          updatedAt: "2026-10-31T12:00:00.000Z",
          session: "session-main",
        },
        {
          chat: "chat-only",
          backend: "opencode",
          title: "Tab without a session",
          updatedAt: "2026-10-30T12:00:00.000Z",
        },
      ];
    },
  };
</script>
