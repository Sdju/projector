name: macOS

on:
  push:
    branches: [master, windows-ci, macos-ci]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install native dependencies
        run: brew install ripgrep gtk4 gobject-introspection pkg-config
      - uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - name: Install locked dependencies
        run: vp install --frozen-lockfile
      - name: Architecture
        run: vp run architecture
      - name: Build vio
        working-directory: packages/vio
        run: vp exec tsdown
      - name: Tests
        timeout-minutes: 15
        run: vp test run
      - name: Real GTK widgets
        run: vp run vio:gtk-test
